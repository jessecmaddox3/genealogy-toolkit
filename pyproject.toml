[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-first-genealogy"
version = "1.0.0"
description = "A local, evidence-first genealogy and research toolkit with complete invented examples."
requires-python = ">=3.12"
dependencies = []
license = "MIT"
readme = "README.md"

[project.scripts]
genealogy = "genealogy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
genealogy = ["schema.sql", "demo_schema.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
